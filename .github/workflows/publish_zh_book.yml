name: Publish Chinese book

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish_zh_book.yml"
      - "jupyter-book-zh/**"
      - "README_zh.md"
      - "scripts/translate_book_zh.py"
      - "scripts/update_from_upstream_zh.ps1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Jupyter Book
        run: |
          pip install --upgrade \
            "jupyter-book==1.0.4.post1" \
            "jupytext==1.16.7" \
            "beautifulsoup4==4.13.3" \
            "sphinx==7.*"

      - name: Build Chinese Jupyter Book
        run: jupyter-book build jupyter-book-zh

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: jupyter-book-zh/_build/html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
